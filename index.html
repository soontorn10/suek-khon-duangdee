<style>

.float-role small{color:#58507e;font-size:11px;font-weight:900}.float-role.left{left:1%;transform:rotate(-14deg);background:#f7bddd}.float-role.right{right:1%;transform:rotate(13deg);background:#a8edf0}

.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.form-row.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:block;margin:0 0 7px;font-size:15px;font-weight:800;color:#64568f}

.btn{border:2px solid #fff7;border-radius:15px;background:#ddd8f6;color:#554785;padding:11px 20px;min-height:52px;font-weight:900;box-shadow:0 5px #b2aad9;transition:transform .12s,filter .12s;display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1.2;text-align:center}
.btn:hover{filter:brightness(1.035);transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 2px #b2aad9}.btn.primary{background:linear-gradient(#fff3b0,#f6ce75);color:#634d78;box-shadow:0 6px #b8a276}
.btn.mint{background:linear-gradient(#d2fbf6,#9fdfe0);color:#355e75;box-shadow:0 6px #7cbaba}.btn.pink{background:linear-gradient(#ffe6f0,#f4b9d9);color:#754e82;box-shadow:0 6px #c592b4}
.btn.ghost{background:#fff3;color:#fff;box-shadow:none;border-color:#fff9}.btn.danger{background:#ffe1e5;color:#a34663;box-shadow:0 5px #dba6b4}.btn.big{min-height:71px;padding:13px 25px;font-size:clamp(20px,2vw,28px)}
.btn.block{width:100%}.actions{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:19px auto}.muted{color:#897daa;font-size:14px}.lightmuted{color:#f3eaffc9}.center{text-align:center}.small{font-size:13px}.large{font-size:clamp(24px,3.2vw,43px);font-weight:900}

.role-row{display:flex;gap:clamp(7px,1.4vw,20px);justify-content:center;flex-wrap:wrap;margin:18px auto 23px}.role-card{position:relative;width:clamp(90px,11vw,154px);min-height:clamp(117px,13vw,166px);border:3px solid #fffdf6;border-radius:17px;background:linear-gradient(145deg,#f9d7e9,#dfc9f0);box-shadow:0 7px #5d5396,0 12px 20px #39336a73;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#544b77;font-weight:900}

.question-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}.qbox{padding:14px 17px;border:2px solid #e9dff8;border-radius:18px;background:#fff}

.stat{display:grid;grid-template-columns:minmax(80px,180px) minmax(130px,1fr) 35px;align-items:center;gap:10px;margin:13px 0;font-weight:800;color:#574d84}.bar-bg{height:23px;background:#ebe6f5;border-radius:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#a1deda,#7ec9d1);border-radius:20px}.bar-fill.correct{background:linear-gradient(90deg,#ffca8a,#edab73)}.discussion{border:2px dashed #baa6de;background:#f9f3ff;padding:15px 21px;border-radius:17px;margin-top:18px;color:#62548b;font-weight:800}

.winner{font-size:clamp(40px,5vw,75px);font-weight:900;color:#ffefb2;text-shadow:0 5px #77599b,0 11px #42377c}

.mission .role-card{animation:card-reveal .52s ease-out both;animation-delay:calc(var(--i,0)*.11s)}.winner,.result-number{animation:champion-glow 1.5s infinite}

.table-wrap{overflow:auto;border:1px solid #e1dbee;border-radius:15px;background:#fff}table{width:100%;border-collapse:collapse;min-width:700px;color:#554a7e}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eee7f7;font-size:13px}th{background:#e8e3f7;font-weight:900}tr:nth-child(even){background:#faf8ff}
.score-input{width:65px;padding:4px 7px;border:1px solid #c7b9e2;border-radius:7px;background:white;color:#594d84}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{padding:17px;text-align:center;border-radius:17px;background:#fff;border:2px solid #eae3f6}.metric strong{display:block;font-size:34px;color:#6554ac}

.countdown{position:fixed;inset:0;z-index:50;display:grid;place-content:center;text-align:center;background:#322b75e6;backdrop-filter:blur(5px)}.countdown strong{font-size:min(34vw,260px);line-height:1;text-shadow:0 12px #9a78c2}.countdown span{font-size:30px;font-weight:900}
.countdown .skip{margin:27px auto 0;max-width:220px;background:#ffffff2b;color:#fff}
.loading-mask{position:fixed;inset:0;z-index:60;display:grid;place-content:center;text-align:center;background:#39316fbb;backdrop-filter:blur(4px);color:#fff;font-weight:900;font-size:clamp(20px,3vw,30px)}
.loading-wheel{width:68px;height:68px;margin:0 auto 19px;border:7px solid #fff6;border-top-color:#ffe4a3;border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.live-progress{display:inline-flex;align-items:center;gap:7px;background:#e1f6f2;border:2px solid #a8dfd8;color:#426e70;padding:6px 12px;border-radius:30px;font-weight:900;font-size:clamp(13px,1.2vw,18px)}
.live-progress strong{font-size:1.25em}.group-pills{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:8px auto}

.roster-table{max-height:47vh;overflow:auto}.roster-table table{min-width:560px}
.roster-edit{margin-top:12px;padding:14px;border-radius:16px;background:#eefaf7;border:2px solid #b3e4dd}

.champion-burst i{position:absolute;top:-8%;left:calc(var(--i)*4%);width:10px;height:20px;border-radius:3px;background:hsl(calc(var(--i)*45),85%,78%);animation:confetti-fall calc(2.2s + var(--i)*.045s) linear infinite;animation-delay:calc(var(--i)*-.15s)}
@keyframes confetti-fall{to{transform:translate3d(calc((var(--i) - 11)*2vw),115vh,0) rotate(800deg)}}
.teacher-tag{font-size:12px;color:#fff;opacity:.85;text-align:center}.pin-hint{font-size:14px;letter-spacing:.06em;color:#655a8d}

/* ศึกคนดวงดี v7 — ใช้ชุดสีเดิมและภาพการ์ดจริง */
.role-card{padding:3px;overflow:hidden;border-radius:8px;min-height:0;aspect-ratio:3/4;background:#fff!important}
.role-card img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 5px #4e40703d)}
.role-card .fallback{display:none;font-size:clamp(33px,5vw,60px)}
.role-card.broken img{display:none}.role-card.broken .fallback{display:grid;place-items:center;height:100%}
.role-card.out{filter:grayscale(.85);opacity:.53}.role-card.out:after{font-size:clamp(45px,6vw,80px);inset:0;display:grid;place-content:center;background:#423c4a4c}
.role-card .role-name{position:absolute;bottom:3px;left:3px;right:3px;border-radius:6px;background:#fffa;
  color:#463765;font-size:clamp(10px,1vw,15px);text-align:center;padding:1px 2px;line-height:1.2}

function jsonp(p){return new Promise((resolve,reject)=>{
  const cb='c'+uid().replaceAll('-',''),script=document.createElement('script');let done=false;
  const end=(data,err)=>{if(done)return;done=true;clearTimeout(timer);script.remove();delete window[cb];
    err?reject(err):resolve(data);};const timer=setTimeout(()=>end(null,Error('เชื่อมต่อหมดเวลา')),9000);
  window[cb]=data=>end(data);script.onerror=()=>end(null,Error('เชื่อมต่อ Google Sheets ไม่ได้'));
  script.src=API+'?'+new URLSearchParams({...p,callback:cb,t:Date.now()});document.head.appendChild(script);
});}

  for(let i=0;i<32;i++){await delay(i<6?700:1400);
    try{const r=await jsonp({action:'receipt',requestId});if(r.error==='WAITING')continue;
      if(!r.ok)throw Error(r.error||'SERVER_ERROR');return r.data;
    }catch(e){if(['เชื่อมต่อ Google Sheets ไม่ได้','เชื่อมต่อหมดเวลา'].includes(e.message))continue;throw e;}}

function note(hz,when=0,duration=.13,volume=.15){if(!S.sound||!S.mode.startsWith('teacher'))return;
  try{const c=audioReady();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+when;
    o.type='triangle';o.frequency.setValueAtTime(hz,t);o.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(Math.max(.001,volume*S.sfxVolume/100),t);
    g.gain.exponentialRampToValueAtTime(.001,t+duration);
    o.start(t);o.stop(t+duration+.01);}catch(_){}}
function sfx(kind='step'){const patterns={step:[620,785,930],intro:[590,745,990,1180],
  reveal:[660,880,1100,1320],out:[1050,840,720,950],win:[720,920,1180,1440,1740],tick:[980,1250]};
  (patterns[kind]||patterns.step).forEach((n,i)=>note(n,i*(kind==='tick'?.08:.12),kind==='tick'?.09:.27));}
function bgmLevel(duck=false){const el=$('bgm');if(el)el.volume=S.sound&&S.mode.startsWith('teacher')?
  Math.max(0,Math.min(1,S.bgmVolume/100))*(duck ? .24 : 1):0;}
function bgm(play){const el=$('bgm');if(!el)return;
  if(!play||!S.sound||!S.mode.startsWith('teacher')){el.pause();return;}
  if(!el.getAttribute('src'))el.setAttribute('src',BGM_FILE);
  bgmLevel(!!S.fx);el.play().catch(()=>{});}
function stopFx(){if(S.fx){S.fx.onended=null;S.fx.pause();S.fx.currentTime=0;S.fx=null;}
  clearTimeout(S.fxStopTimer);S.fxStopTimer=null;bgmLevel(false);}
function playFx(kind,maxSeconds=4){if(!S.sound||!S.mode.startsWith('teacher'))return null;
  stopFx();const a=new Audio(FX_FILE[kind]);a.preload='auto';a.volume=Math.max(0,Math.min(1,S.sfxVolume/100));
  S.fx=a;bgmLevel(true);
  a.onended=()=>{if(S.fx===a){S.fx=null;bgmLevel(false);}};
  a.play().catch(()=>{if(S.fx===a){S.fx=null;bgmLevel(false);sfx(kind==='out'?'out':'reveal');}});
  S.fxStopTimer=setTimeout(()=>{if(S.fx===a)stopFx();},maxSeconds*1000);return a;}
function fireworksSound(seconds=2.8){if(!S.sound||!S.mode.startsWith('teacher'))return;
  try{const c=audioReady(),sr=c.sampleRate,length=Math.round(sr*.17),noise=c.createBuffer(1,length,sr);
    const buf=noise.getChannelData(0);for(let i=0;i<length;i++)buf[i]=Math.random()*2-1;
    const count=8,now=c.currentTime;
    for(let i=0;i<count;i++){const t=now+i*(seconds-.2)/(count-1),o=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();
      o.buffer=noise;f.type='highpass';f.frequency.value=800+i*130;o.connect(f);f.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.21*S.sfxVolume/100,t+.025);
      g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.18);
      if(i%2===0)note(1000+i*85,i*(seconds-.2)/(count-1),.22,.14);}}
  catch(_){sfx('win');}}

function nextLabel(r){if(r.phase==='LOBBY')return '🃏 เปิดตัวละคร!';

  if(r.phase==='RESULTS')return '✨ เฉลย';

      <p class="exit-hints">📝 เขียนในใบภารกิจ: สถานการณ์ • วิธีสุ่ม • ประโยชน์</p>

function qBadge(r){return r.questionId==='K3'?'🧠 ชวนคิดหลังเกม':`ภารกิจ ${r.stage} · MATH MISSION`;}

function drawTeacherView(r){const d=(r.draws||[]).find(x=>x.stage===r.stage),survivors=remaining(r);

function formQuestion(r){const q=r.question||{},id=r.questionId,done=getSent()[id];

function studentRoomView(){const r=S.room,p=S.student;if(!r||!p)return '';

function downloadFile(name,body,mime){const url=URL.createObjectURL(new Blob([body],{type:mime}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);}
function downloadReport(type){const r=S.report;if(!r)return;
  const pass=x=>x===null?'รอประเมิน':x?'ผ่าน':'ไม่ผ่าน';
  const rows=r.individual.map(p=>[p.rollNo,p.studentName,p.groupNo,p.role,
    ...['PRE','K1','K2','P2','P3','P4','K3'].map(q=>Array.isArray(p.answers[q]?.answer)?
      p.answers[q].answer.join(' / '):p.answers[q]?.answer??''),
    p.K.score,pass(p.K.passed),p.P.score??'',pass(p.P.passed),p.P.verified?'ยืนยันแล้ว':'รอตรวจใบภารกิจ',
    p.A.score??'',pass(p.A.passed)]);
  const head=['เลขที่','ชื่อ-สกุล','กลุ่ม','การ์ด','PRE','K1','K2','P2','P3','P4','K3',
    'K คะแนน','K ผล','P คะแนน','P ผล','สถานะ P','A คะแนน','A ผล'];
  if(type==='csv'){const cell=x=>{let t=String(x??'');if(/^[=+@-]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"';};
    downloadFile('ศึกคนดวงดี_'+r.room.pin+'.csv','\uFEFF'+[head,...rows].map(a=>a.map(cell).join(',')).join('\r\n'),
      'text/csv;charset=utf-8');}
  else{const lines=[`ศึกคนดวงดี — สุ่มนี้...ชี้ชะตา`,`ห้อง ${r.room.className} · PIN ${r.room.pin}`,
    `ลงทะเบียน ${r.summary.registered}/${r.summary.expected} คน`,
    `ผ่าน K ${r.summary.kPassed} คน · P ${r.summary.pPassed} คน · A ${r.summary.aPassed} คน`,'',
    'เลขที่ | ชื่อ | กลุ่ม | K | P | A',...r.individual.map(p=>
      `${p.rollNo} | ${p.studentName} | ${p.groupNo} | ${p.K.score}/3 (${pass(p.K.passed)}) | ${p.P.score??'–'}/3 (${pass(p.P.passed)}) | ${p.A.score??'–'}/3 (${pass(p.A.passed)})`)];
    downloadFile('ศึกคนดวงดี_'+r.room.pin+'.txt',lines.join('\n'),'text/plain;charset=utf-8');}
  toast('ดาวน์โหลดรายงานเรียบร้อย');}
function rememberScene(r){if(S.mode!=='teacherRoom')return;S.history[r.scene]=r;

async function refreshRoom(force=false){if(!S.pin)return;const r=await getRoom(S.pin),old=S.room;
  S.room=r;rememberScene(r);const key=S.mode+'|'+r.pin+'|'+r.scene+(r.phase==='LOBBY'?'|'+r.registered:'');
  if(force||key!==S.viewKey){S.viewKey=key;render();}else updateLive();
  if(old?.scene!==r.scene&&r.phase==='REVEAL'&&S.mode==='teacherRoom')playFx('reveal',3.2);}
async function enterTeacherRoom(pin){S.pin=String(pin);S.mode='teacherRoom';S.champion=null;
  sessionStorage.setItem('luck_teacher_pin',S.pin);localStorage.setItem('luck_last_room',S.pin);

async function enterStudentByPin(pin,room){S.pin=pin;S.room=room;

async function loadRooms(){S.rooms=await post('rooms',{},true);if(S.mode==='teacherHome')render();}
async function openReports(){S.mode='teacherReport';S.report=null;S.tab='overview';render();
  S.report=await post('report',{pin:S.pin},true);render();}
function timerKey(){return 'luck_timer_v6_'+S.pin+'_'+S.room?.scene;}
function timeFormat(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function updateClock(){const el=$('timer');if(!el)return;const key=timerKey();
  if(S.clockKey!==key){S.clockKey=key;S.timerPaused=false;}
  let since=Number(sessionStorage.getItem(key));if(!since){since=Date.now();sessionStorage.setItem(key,String(since));}
  const now=S.timerPaused?S.timerPauseAt:Date.now(),left=180-Math.floor((now-since)/1000);
  el.textContent=(left<0?'+':'')+timeFormat(Math.abs(left));el.classList.toggle('over',left<0);
  const b=$('pause-btn');if(b)b.textContent=S.timerPaused?'▶ ต่อเวลา':'⏸ พักเวลา';}
function pauseTimer(){const k=timerKey(),s=Number(sessionStorage.getItem(k)||Date.now());
  if(S.timerPaused){sessionStorage.setItem(k,String(s+Date.now()-S.timerPauseAt));S.timerPaused=false;}
  else{S.timerPaused=true;S.timerPauseAt=Date.now();}updateClock();}
async function nextTeacher(){const r=S.room,draw=r.phase==='REVEAL'&&['PRE','P2','P3','P4'].includes(r.questionId);
  if(r.phase==='INTRO')await openingEffect('เปิดโจทย์!');
  if(draw)await shuffleEffect(r);
  if(draw)loading(true,'กำลังตรวจผลสุ่มจากระบบ...');
  const changed=await post(draw?'draw':'advance',{pin:S.pin,expectedScene:r.scene},true);
  await refreshRoom(true);
  if(r.phase==='LOBBY')await introCards(S.room);
  if(draw){playFx('reveal',2.4);
    if(r.stage===4){try{S.champion=(await post('report',{pin:S.pin},true)).champion;render();}catch(_){}
      setTimeout(()=>{if(S.room?.phase==='DRAW'&&S.room.stage===4)burst(true);},2500);}
    else setTimeout(()=>{if(S.room?.phase==='DRAW'&&S.room.stage===r.stage)playFx('out',3.3);},2500);}
  if(r.phase==='SUMMARY')S.summaryOpen=false;
  if(changed?.alreadyAdvanced)toast('หน้าจอปรับตามสถานะเกมล่าสุดแล้ว');}
function numbersFor(roll,keys){const obj={};keys.forEach(k=>{const el=document.querySelector(`[data-roll="${roll}"][data-score="${k}"]`);
  if(!el||el.value==='')throw Error('กรุณาเลือกคะแนนให้ครบทุกช่อง');obj[k]=el.value;});return obj;}
async function handleAction(e){const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='skip-effect'){S.skipEffect=true;return;}if(S.busy)return;
  if(a==='sound'){S.sound=!S.sound;localStorage.setItem('luck_sound',S.sound?'on':'off');
    if(S.sound){bgm(true);sfx('step');}else{stopFx();bgm(false);}render();return;}
  if(a==='sound-settings'){S.soundPanel=!S.soundPanel;render();return;}
  if(a==='test-sfx'){sfx('win');fireworksSound(2.6);return;}
  if(a==='return-live'){S.preview=null;render();return;}
  if(a==='preview-stage'){const scene=el.dataset.scene;
    if(scene==='live'){S.preview=null;render();return;}
    if(scene!==''&&S.history[Number(scene)]){S.preview=S.history[Number(scene)];render();}return;}
  if(a==='preview-back'){const current=S.preview?.scene??S.room?.scene;
    const prior=Object.keys(S.history).map(Number).filter(n=>n<current).sort((a,b)=>b-a)[0];
    if(prior!==undefined){S.preview=S.history[prior];render();}return;}
  if(a==='landing'){S.mode='landing';render();return;}
  if(a==='teacher-login'){S.mode=S.pass?'teacherHome':'teacherLogin';render();bgm(true);audioReady();
    if(S.pass)guarded(loadRooms,'กำลังโหลดห้องเกม...');return;}
  if(a==='student-entry'){S.mode='studentEntry';render();return;}
  if(a==='teacher-home'){S.mode='teacherHome';render();guarded(loadRooms,'กำลังโหลดห้องเกม...');return;}
  if(a==='report-tab'){S.tab=el.dataset.tab;render();return;}
  if(a==='download-csv'||a==='download-txt'){downloadReport(a.endsWith('csv')?'csv':'txt');return;}
  if(a==='print'){window.print();return;}
  if(a==='open-sheet'){window.open(SHEET_URL,'_blank','noopener');return;}
  if(a==='timer-pause'){pauseTimer();return;}
  if(a==='timer-reset'){sessionStorage.setItem(timerKey(),String(Date.now()));S.timerPaused=false;updateClock();return;}
  if(a==='show-summary'){S.summaryOpen=true;render();return;}
  if(a==='copy-link'){navigator.clipboard.writeText(qrLink(S.pin)).then(()=>toast('คัดลอกลิงก์แล้ว'))
    .catch(()=>toast('คัดลอกไม่สำเร็จ',true));return;}
  if(a==='edit-student'){S.editRoll=Number(el.dataset.roll);render();return;}
  if(a==='cancel-edit'){S.editRoll=null;render();return;}
  if(a==='open-room'){guarded(()=>enterTeacherRoom(el.dataset.pin),'กำลังเปิดห้อง...');return;}
  if(a==='reload-rooms'){guarded(loadRooms,'กำลังโหลดรายชื่อห้อง...');return;}
  if(a==='check-roster'||a==='refresh-roster'){
    guarded(async()=>{S.roster=await post('roster',{pin:S.pin},true);S.mode='teacherRoster';S.editRoll=null;render();},
      'กำลังตรวจรายชื่อ...');return;}
  if(a==='back-to-game'){guarded(()=>enterTeacherRoom(S.pin),'กำลังกลับเข้าเกม...');return;}
  if(a==='reports'||a==='refresh-report'){guarded(async()=>{
    if(a==='refresh-report'&&S.report){S.report=await post('report',{pin:S.pin},true);render();}
    else await openReports();},'กำลังดึงรายงานล่าสุด...');return;}
  if(a==='next-scene'){if(S.preview){toast('ขณะย้อนดูไม่สามารถเปลี่ยนด่านได้');return;}
    const r=S.room,missing=(r.registered||0)-(r.submitted||0);
    if(r.phase==='QUESTION'&&missing>0&&!window.confirm(`มีผู้ยังไม่ส่งคำตอบ ${missing} คน\nต้องการปิดรับคำตอบและไปต่อหรือไม่?`))return;
    guarded(nextTeacher,'กำลังดำเนินภารกิจ...');return;}
  if(a==='save-p'||a==='save-a'){const roll=el.dataset.roll;
    guarded(async()=>{const fields=a==='save-p'?['p2Score','p3Score','p4Score']:
      ['aSituation','aMethod','aBenefit'];
      await post(a==='save-p'?'setP':'setA',{pin:S.pin,rollNo:roll,...numbersFor(roll,fields)},true);
      S.report=await post('report',{pin:S.pin},true);render();toast('บันทึกคะแนนแล้ว');},'กำลังบันทึกคะแนน...');return;}
}

    const room=await getRoom(pin);await enterStudentByPin(pin,room);},'กำลังค้นหาห้อง...');
  if(id==='register-form')return guarded(async()=>{
    const mode=e.submitter?.value||'new',data={pin:S.pin,studentName:f.get('studentName'),rollNo:f.get('rollNo')};
    if(mode==='new'){data.groupNo=f.get('groupNo');data.role=f.get('role');
      if(!data.groupNo||!data.role)throw Error('กรุณาเลือกกลุ่มและการ์ด');}
    const result=await post('register',data);await enterStudentRoom({...result.student,pin:S.pin});
    toast(result.rejoined?'กลับเข้าห้องเดิมแล้ว':'ลงทะเบียนสำเร็จ');},'กำลังบันทึกข้อมูลนักเรียน...');
  if(id==='edit-form')return guarded(async()=>{await post('updateStudent',{pin:S.pin,rollNo:f.get('rollNo'),
    newRollNo:f.get('newRollNo'),newStudentName:f.get('newStudentName'),newGroupNo:f.get('newGroupNo'),
    newRole:f.get('newRole')},true);S.roster=await post('roster',{pin:S.pin},true);
    S.room=await getRoom(S.pin);S.editRoll=null;render();toast('แก้ไขรายชื่อแล้ว');},'กำลังแก้ไขข้อมูล...');
  if(form.matches('.answer-form'))return guarded(async()=>{
    const q=form.dataset.q;let answer=f.get('answer');
    if(q==='P4'){const all=[0,1,2].map(i=>f.get('p4_'+i));
      if(all.some(v=>v===null))throw Error('กรุณาตอบสถานการณ์ทั้ง 3 ข้อ');answer=JSON.stringify(all);}
    if(answer===null||answer==='')throw Error('กรุณาเลือกคำตอบ');
    const p=S.student,res=await post('answer',{pin:S.pin,rollNo:p.rollNo,
      studentName:p.studentName,sessionKey:p.sessionKey,questionId:q,answer});
    if(res.accepted){storeSent(q);render();toast('✅ ส่งคำตอบแล้ว');}},'กำลังส่งคำตอบ...');
}
document.addEventListener('click',e=>handleAction(e));
document.addEventListener('submit',e=>handleForm(e));
document.addEventListener('input',e=>{const key=e.target?.dataset?.volume;if(!['bgm','sfx'].includes(key))return;
  const v=Math.max(0,Math.min(100,Number(e.target.value)||0));
  if(key==='bgm'){S.bgmVolume=v;localStorage.setItem('luck_bgm_volume',String(v));bgmLevel(!!S.fx);}
  else{S.sfxVolume=v;localStorage.setItem('luck_sfx_volume',String(v));if(S.fx)S.fx.volume=v/100;}
  const x=$(key+'-percentage');if(x)x.textContent=v+'%';});
setInterval(()=>{if(!S.busy&&S.pin&&['teacherRoom','studentRoom','publicLobby','teacherRoster'].includes(S.mode))
  refreshRoom().catch(()=>{});},5000);
setInterval(updateClock,450);
async function init(){const pin=new URLSearchParams(location.search).get('pin');
  if(pin){S.pin=pin;S.mode='studentEntry';render();await guarded(async()=>{
    const room=await getRoom(pin);await enterStudentByPin(pin,room);},'กำลังเข้าห้องเกม...');return;}
  const teacherPin=sessionStorage.getItem('luck_teacher_pin'),lastPin=localStorage.getItem('luck_last_room');
  if(S.pass&&teacherPin){try{await enterTeacherRoom(teacherPin);return;}catch(_){S.mode='teacherHome';render();}}
  else if(lastPin){S.pin=lastPin;S.mode='publicLobby';try{await refreshRoom(true);return;}
    catch(_){localStorage.removeItem('luck_last_room');}}
  S.mode='landing';S.pin='';S.room=null;render();}
init();

</script></body></html>
