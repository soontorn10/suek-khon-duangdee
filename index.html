function jsonp(params) {
  return new Promise((resolve,reject)=>{
    const cb='cb_'+uuid().replace(/-/g,''),script=document.createElement('script');
    let done=false;const end=(v,err)=>{if(done)return;done=true;clearTimeout(timer);
      script.remove();delete window[cb];err?reject(err):resolve(v)};
    const timer=setTimeout(()=>end(null,Error('เชื่อมต่อหมดเวลา')),8000);
    window[cb]=data=>end(data);script.onerror=()=>end(null,Error('เชื่อมต่อ Google Sheets ไม่ได้'));
    script.src=API+'?'+new URLSearchParams({...params,callback:cb,t:Date.now()});
    document.head.appendChild(script);
  });
}
async function apiPost(action,data={},teacher=false) {
  const requestId=uuid(),payload=new URLSearchParams({action,requestId,...data});
  if (teacher) payload.set('adminPassword',S.pass);
  const sending=fetch(API,{method:'POST',mode:'no-cors',body:payload,cache:'no-store'}).catch(()=>{});
  await Promise.race([sending,wait(900)]);
  for (let i=0;i<32;i++) {
    await wait(i<6?700:1400);
    try {
      const reply=await jsonp({action:'receipt',requestId});
      if (reply.error==='WAITING') continue;
      if (!reply.ok) throw Error(reply.error||'SERVER_ERROR');
      return reply.data;
    } catch(e) {
      if (e.message==='เชื่อมต่อ Google Sheets ไม่ได้'||e.message==='เชื่อมต่อหมดเวลา')continue;
      throw e;
    }
  }
  throw Error('ยังไม่ได้รับการยืนยันจากระบบ ตรวจเน็ตหรือกลับเข้าห้องเดิม');
}

  if(S.busy)return;S.busy=true;document.body.style.cursor='progress';
  try {await task()} catch(e){toast(friendly(e),true);console.warn(e)}

}
function sfx(type='chime') {
  if (!S.sound)return;
  try {
    const C=window.AudioContext||window.webkitAudioContext,c=new C();
    const notes=type==='drum'?[180,145,110]:type==='win'?[523,659,784,1046]:[523,660,784];
    notes.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.12;
      o.type=type==='drum'?'triangle':'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(.075,t);g.gain.exponentialRampToValueAtTime(.001,t+.21);
      o.start(t);o.stop(t+.22)});
    setTimeout(()=>c.close(),1400);
  }catch(_){}
}

async function refreshRoom(force=false) {
  if(!S.pin)return;
  const r=await roomStatus(S.pin),old=S.room;
  S.room=r;
  if(S.student&&r.eliminatedRoles.includes(S.student.role)&&!S.student.eliminatedStage){
    S.student.eliminatedStage=r.stage;saveStudent();
  }
  const key=S.mode+'|'+r.pin+'|'+r.stage+'|'+r.phase;
  if(force||S.viewKey!==key){S.viewKey=key;render();}
  else updateLive();
  if(old?.phase!=='DRAW'&&r.phase==='DRAW'&&r.stage===4&&S.mode==='studentRoom')sfx('win');
}
async function enterTeacherRoom(pin) {

function timerKey(){return 'luck_timer_'+S.pin+'_'+S.room?.stage;}
function updateClock() {
  const el=$('timer');if(!el)return;
  const key=timerKey();
  if(S.clockKey!==key){S.clockKey=key;S.timerPaused=false;}
  let started=Number(sessionStorage.getItem(key));
  if(!started){started=Date.now();sessionStorage.setItem(key,String(started));}
  const now=S.timerPaused?S.timerPauseAt:Date.now();
  const left=180-Math.floor((now-started)/1000);
  el.textContent=(left<0?'+':'')+fmtTime(Math.abs(left));
  el.classList.toggle('over',left<0);
  const btn=$('pause-btn');if(btn)btn.textContent=S.timerPaused?'▶ ต่อเวลา':'⏸ พักเวลา';
}
function toggleTimerPause(){
  const key=timerKey(),start=Number(sessionStorage.getItem(key)||Date.now());
  if(S.timerPaused){
    sessionStorage.setItem(key,String(start+(Date.now()-S.timerPauseAt)));
    S.timerPaused=false;
  }else {S.timerPaused=true;S.timerPauseAt=Date.now();}
  updateClock();
}
async function teacherTransition(action) {
  const pin=S.pin,stage=S.room.stage,previous=(S.room.eliminatedRoles||[]).slice();
  if(['question','draw'].includes(action))await dramatic(action==='draw'?'สุ่มชี้ชะตา!':'เปิดคำถาม!');
  await apiPost(action,{pin},true);
  if(action==='draw'){
    S.lastDraw={pin,stage,removed:[],winnerGroup:null};
    await refreshRoom(true);
    S.lastDraw.removed=(S.room.eliminatedRoles||[]).filter(x=>!previous.includes(x));
    S.lastDraw.winnerGroup=S.room.winnerGroup;
    if(stage===4) {
      try {const rep=await apiPost('report',{pin},true);S.champion=rep.champion;}catch(_){}
      sfx('win');
    } else sfx('drum');
    render();return;
  }
  await refreshRoom(true);
  if(action==='next')S.lastDraw=null;
}
async function handleAction(e) {
  const el=e.target.closest('[data-act]');if(!el||S.busy)return;
  const act=el.dataset.act;
  if(act==='sound'){
    S.sound=!S.sound;localStorage.setItem('luck_sound',S.sound?'on':'off');
    const bgm=$('bgm');if(!S.sound)bgm.pause();
    else if(BGM_FILE){bgm.src=BGM_FILE;bgm.play().catch(()=>{});}
    sfx();render();return;
  }
  if(act==='landing'){S.mode='landing';render();return;}
  if(act==='student-entry'){S.mode='studentEntry';render();return;}
  if(act==='teacher-login'){S.mode='teacherLogin';render();return;}
  if(act==='logout'){S.pass='';sessionStorage.removeItem('luck_admin');
    sessionStorage.removeItem('luck_teacher_pin');S.mode='landing';render();return;}
  if(act==='teacher-home'){S.mode='teacherHome';S.pin='';S.room=null;render();
    guarded(loadRooms);return;}
  if(act==='timer-pause'){toggleTimerPause();return;}
  if(act==='timer-reset'){sessionStorage.setItem(timerKey(),String(Date.now()));
    S.timerPaused=false;updateClock();toast('เริ่มนับเวลา 3 นาทีใหม่แล้ว');return;}
  if(act==='copy-link'){
    navigator.clipboard.writeText(qrLink(S.pin)).then(()=>toast('คัดลอกลิงก์เข้าห้องแล้ว'))
      .catch(()=>toast('คัดลอกไม่สำเร็จ กรุณาใช้ QR หรือ PIN',true));return;
  }
  if(act==='report-tab'){S.tab=el.dataset.tab;render();return;}
  if(act==='download-csv'){downloadCSV();return;}
  if(act==='print-report'){window.print();return;}
  if(act==='save-a'){
    const score=document.querySelector('[data-score="'+el.dataset.roll+'"]')?.value;
    if(score===''||score===undefined){toast('กรุณาเลือกคะแนน A ตั้งแต่ 0 ถึง 3',true);return;}
    guarded(async()=>{await apiPost('setA',{pin:S.pin,rollNo:el.dataset.roll,aScore:score},true);
      S.report=await apiPost('report',{pin:S.pin},true);render();toast('บันทึกคะแนน A แล้ว');});
    return;
  }
  if(act==='open-sheet'){
    guarded(async()=>{const rooms=await apiPost('rooms',{},true);
      const row=rooms.find(r=>r.pin===S.pin);
      if(!row?.spreadsheetId)throw Error('ไม่พบไฟล์ Google Sheets ของห้องนี้');
      window.open('https://docs.google.com/spreadsheets/d/'+encodeURIComponent(row.spreadsheetId)+'/edit','_blank','noopener');
    });return;
  }
  if(act==='trash-room'){
    const pin=el.dataset.pin;
    if(!confirm('ย้ายไฟล์ห้อง PIN '+pin+' ไปถังขยะ? ข้อมูลห้องนั้นจะเปิดเล่นไม่ได้'))return;
    const confirmPin=prompt('พิมพ์ PIN '+pin+' เพื่อยืนยันการย้ายไปถังขยะ');
    if(confirmPin!==pin){toast('ยกเลิกการลบห้องแล้ว');return;}
    guarded(async()=>{await apiPost('trash',{pin,confirmPin},true);
      await loadRooms();toast('ย้ายไฟล์ห้องไปถังขยะแล้ว กู้คืนได้ใน Google Drive');});
    return;
  }
  if(act==='open-room'){guarded(()=>enterTeacherRoom(el.dataset.pin));return;}
  if(act==='reload-rooms'){guarded(loadRooms);return;}
  if(act==='reports'||act==='refresh-report'){
    guarded(async()=>{if(act==='refresh-report'&&S.report){S.report=await apiPost('report',{pin:S.pin},true);render();}
      else await openReports();});return;
  }
  if(act==='return-game'){guarded(()=>enterTeacherRoom(S.pin));return;}
  const actions={'game-start':'start','show-question':'question','close-question':'close',
    'game-draw':'draw','next-stage':'next','show-exit':'exit'};
  if(actions[act]){guarded(()=>teacherTransition(actions[act]));return;}
}
function downloadCSV(){
  const r=S.report;if(!r)return;
  const header=['เลขที่','ชื่อ-สกุล','กลุ่ม','ตัวละคร','สถานะ','K1','P2','P3','K4A','P4B',
    'K คะแนน','K ผ่าน','P คะแนน','P ผ่าน','A คะแนน','A ผ่าน','ข้อเสนอแนะ A'];
  const rows=r.individual.map(p=>[p.rollNo,p.studentName,p.groupNo,p.role,p.status,
    ...['K1','P2','P3','K4A','P4B'].map(q=>p.answers[q]?.answer??''),
    p.K.score,p.K.passed?'ผ่าน':'ไม่ผ่าน',p.P.score,p.P.passed?'ผ่าน':'ไม่ผ่าน',
    p.A.score??'',p.A.passed===null?'ยังไม่ตรวจ':p.A.passed?'ผ่าน':'ไม่ผ่าน',p.A.note]);
  const csvCell=value=>{
    let s=String(value??'');
    if(/^[=+@-]/.test(s))s="'"+s; // ป้องกันสูตรแฝงเมื่อเปิดใน Excel
    return '"'+s.replace(/"/g,'""')+'"';
  };
  const csv='\uFEFF'+[header,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  const a=document.createElement('a');a.href=url;a.download='ศึกคนดวงดี_'+r.room.pin+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),6000);
  toast('ดาวน์โหลด CSV แล้ว สามารถเปิดด้วย Excel ได้');
}
document.addEventListener('click',e=>{if(e.target.closest('[data-act]'))handleAction(e);});
document.addEventListener('submit',e=>{
  const form=e.target;if(!['teacher-login-form','create-form','find-room-form',
    'student-register-form'].includes(form.id)&&!form.matches('.answer-form'))return;
  e.preventDefault();
  const f=new FormData(form);
  if(form.id==='teacher-login-form')guarded(async()=>{
    S.pass=String(f.get('password')||'');
    await apiPost('login',{},true);
    sessionStorage.setItem('luck_admin',S.pass);S.mode='teacherHome';S.pin='';
    render();await loadRooms();sfx();toast('เข้าสู่โหมดครูสำเร็จ');
  });
  else if(form.id==='create-form')guarded(async()=>{
    const game=await apiPost('create',{className:f.get('className'),students:f.get('students')},true);
    await enterTeacherRoom(game.pin);sfx('win');toast('สร้างห้อง PIN '+game.pin+' แล้ว');
  });
  else if(form.id==='find-room-form')guarded(async()=>{
    const pin=String(f.get('pin')||'').trim();
    if(!/^[0-9]{4}$/.test(pin))throw Error('กรุณากรอก PIN 4 หลัก');
    const room=await roomStatus(pin);S.pin=pin;S.room=room;
    const saved=(()=>{try{return JSON.parse(localStorage.getItem('luck_student')||'null')}catch(_){return null}})();
    if(saved?.pin===pin&&saved.roomId===room.roomId&&saved.sessionKey)await enterStudentRoom(saved,true);
    else {S.mode='studentRegister';render();}
  });
  else if(form.id==='student-register-form')guarded(async()=>{
    const mode=e.submitter?.value||'new';
    const data={pin:S.pin,studentName:f.get('studentName'),rollNo:f.get('rollNo')};
    if(mode==='new'){data.groupNo=f.get('groupNo');data.role=f.get('role');}
    const result=await apiPost('register',data,false);
    await enterStudentRoom({...result.student,pin:S.pin});
    sfx();toast(result.rejoined?'กลับเข้าห้องเดิมแล้ว':'รับการ์ดตัวละครสำเร็จ!');
  });
  else if(form.matches('.answer-form'))guarded(async()=>{
    const q=form.dataset.q,answer=f.get('answer');
    if(answer===null||String(answer)==='')throw Error('กรุณาเลือกหรือกรอกคำตอบ');
    const p=S.student;
    const result=await apiPost('answer',{pin:S.pin,rollNo:p.rollNo,
      studentName:p.studentName,sessionKey:p.sessionKey,questionId:q,answer},false);
    if(result.accepted){storeSent(q);render();sfx();
      toast(result.alreadySubmitted?'เคยส่งคำตอบข้อนี้แล้ว':'✅ ส่งคำตอบเรียบร้อย');}
  });
});
setInterval(()=>{
  if(S.busy||!S.pin||!['teacherRoom','studentRoom'].includes(S.mode))return;
  refreshRoom().catch(()=>{}); // เน็ตสะดุดไม่ล้างคำตอบหรือการ์ดที่บันทึกไว้
},5500);
setInterval(updateClock,400);
async function init(){
  const pin=new URLSearchParams(location.search).get('pin');
  if(pin){
    S.pin=pin;S.mode='studentEntry';render();
    await guarded(async()=>{
      S.room=await roomStatus(pin);
      const saved=(()=>{try{return JSON.parse(localStorage.getItem('luck_student')||'null')}catch(_){return null}})();
      if(saved?.pin===pin&&saved.roomId===S.room.roomId&&saved.sessionKey)await enterStudentRoom(saved,true);
      else {S.mode='studentRegister';render();}
    });
  }else{
    const teacherPin=sessionStorage.getItem('luck_teacher_pin');
    if(S.pass&&teacherPin){
      S.mode='teacherHome';render();
      try {await enterTeacherRoom(teacherPin);}catch(_){S.mode='teacherHome';S.pin='';render();}
    }else{S.mode='landing';render();}
  }
  if(BGM_FILE)$('bgm').src=BGM_FILE;
}
init();
